<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Binary Byte Widget Preview</title>
<style>
  :root { --ey:#ffe600; --blu:#2563eb; }
  *{box-sizing:border-box}
  body{margin:0;padding:46px;background:#f3f5f8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}
  .card{width:100%;max-width:920px;margin:auto;border:1px solid #d9dee7;border-radius:18px;padding:24px;background:#fff;box-shadow:0 12px 35px rgba(15,23,42,.08)}
  .header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
  .eyebrow{display:inline-block;margin-bottom:6px;font-size:11px;font-weight:800;letter-spacing:1.2px;color:#6b7280}
  h1{margin:0;font-size:27px;line-height:1.1;font-weight:800}
  .subtitle{margin:8px 0 0;max-width:600px;color:#5d6678;line-height:1.5;font-size:14px}
  .mode-toggle{display:inline-flex;padding:4px;border-radius:10px;background:#eef2f7;gap:3px}
  button{font:inherit}
  .mode-btn{border:0;border-radius:7px;padding:8px 13px;background:transparent;color:#5d6678;font-weight:700;cursor:pointer}
  .mode-btn.active{background:#fff;color:#172033;box-shadow:0 1px 4px rgba(15,23,42,.13)}
  .board{display:grid;grid-template-columns:repeat(8,minmax(58px,1fr));gap:10px;padding:22px 16px;border-radius:15px;background:linear-gradient(180deg,#172033 0%,#111827 100%);overflow-x:auto}
  .bit-col{min-width:58px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .weight{font-size:12px;color:#aab4c5;font-weight:700}
  .switch{position:relative;width:42px;height:72px;padding:4px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:#30394a;cursor:pointer;transition:all .16s ease;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
  .switch.on{background:var(--ey);box-shadow:0 0 0 3px rgba(255,230,0,.12)}
  .thumb{position:absolute;left:7px;bottom:8px;width:26px;height:26px;border-radius:50%;background:#f8fafc;box-shadow:0 2px 7px rgba(0,0,0,.35);transition:all .16s ease}
  .switch.on .thumb{bottom:36px;background:#111827}
  .bit-value{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.08);color:#c7cfdb;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:800;font-size:18px}
  .bit-value.on{color:#111827;background:var(--ey)}
  .binary-strip{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding:10px 14px;background:#f7f9fc;border-radius:10px}
  .binary-label{font-size:11px;font-weight:800;letter-spacing:1.1px;color:#748094}
  code{font-size:19px;font-weight:800;letter-spacing:3px;color:#172033}
  .output-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:12px}
  .output-card{min-height:128px;border:1px solid #e0e5ed;border-radius:13px;padding:18px;background:#fff}
  .output-label{margin-bottom:8px;font-size:10px;font-weight:800;letter-spacing:1px;color:#7a8598}
  .big-output{font-size:42px;line-height:1;font-weight:850;color:#172033}
  .char-output{font-size:46px;line-height:1;font-weight:850;color:var(--blu)}
  .equation,.explain{margin-top:10px;color:#5f6a7b;font-size:13px;line-height:1.5}
  .explain-title{margin-top:6px;font-size:18px;font-weight:800}
  .footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
  .examples{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.examples span{font-size:12px;color:#6b7280;margin-right:2px}
  .example-btn{border:1px solid #d7dde7;background:#fff;border-radius:8px;padding:6px 10px;font-weight:750;color:#334155;cursor:pointer}
  .reset{border:0;background:transparent;color:#687386;font-weight:700;cursor:pointer;padding:7px 4px}
  .note{display:none;margin-top:14px;border-left:3px solid var(--ey);background:#fffbea;border-radius:0 9px 9px 0;padding:10px 12px;font-size:12px;line-height:1.5;color:#5b5560}
  @media(max-width:700px){body{padding:18px}.card{padding:18px}.board{grid-template-columns:repeat(8,58px)} }
</style>
</head>
<body>
<section class="card">
  <div class="header">
    <div>
      <div class="eyebrow">TRY IT YOURSELF</div>
      <h1>Build a byte</h1>
      <p class="subtitle">Flip the eight switches. Each switch controls one bit: either a 0 or a 1.</p>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="number">Number</button>
      <button class="mode-btn" data-mode="ascii">ASCII</button>
    </div>
  </div>
  <div class="board" id="board"></div>
  <div class="binary-strip"><span class="binary-label">BYTE</span><code id="binary"></code></div>
  <div class="output-grid">
    <div class="output-card">
      <div class="output-label" id="leftLabel">NUMBER</div>
      <div class="big-output" id="decimal">99</div>
      <div class="equation" id="equation"></div>
    </div>
    <div class="output-card" id="rightCard"></div>
  </div>
  <div class="footer">
    <div class="examples"><span>Try an example:</span><div id="exampleButtons"></div></div>
    <button class="reset" id="reset">Reset</button>
  </div>
  <div class="note" id="note"><strong>Small technical note:</strong> standard ASCII uses values 0–127. We are still showing a full 8-bit byte so students can use the same board in both modes.</div>
</section>
<script>
const weights=[128,64,32,16,8,4,2,1];
let bits=weights.map(w => (99 & w)!==0);
let mode='number';
const board=document.getElementById('board');
function asciiInfo(v){
  if(v>=32&&v<=126)return{ch:String.fromCharCode(v),label:`ASCII character ${String.fromCharCode(v)}`,print:true};
  const labels={0:'NUL',8:'Backspace',9:'Tab',10:'Line Feed',13:'Carriage Return',27:'Escape',32:'Space',127:'Delete'};
  if(v<=127)return{ch:'—',label:labels[v]||'Control character',print:false};
  return{ch:'—',label:'Outside standard ASCII (0–127)',print:false};
}
function setValue(v){bits=weights.map(w => (v & w)!==0);render();}
function render(){
  board.innerHTML='';
  bits.forEach((on,i)=>{
    const col=document.createElement('div');col.className='bit-col';
    col.innerHTML=`<div class="weight">${weights[i]}</div><button class="switch ${on?'on':''}" aria-pressed="${on}"><span class="thumb"></span></button><div class="bit-value ${on?'on':''}">${on?1:0}</div>`;
    col.querySelector('button').onclick=()=>{bits[i]=!bits[i];render();};
    board.appendChild(col);
  });
  const value=bits.reduce((t,b,i)=>t+(b?weights[i]:0),0);
  const str=bits.map(b=>b?'1':'0').join('');
  document.getElementById('binary').textContent=str.slice(0,4)+' '+str.slice(4);
  document.getElementById('decimal').textContent=value;
  const active=bits.map((b,i)=>b?weights[i]:null).filter(v=>v!==null);
  document.getElementById('equation').textContent=(active.length?active.join(' + '):'0')+' = '+value;
  document.getElementById('leftLabel').textContent=mode==='number'?'NUMBER':'DECIMAL VALUE';
  const right=document.getElementById('rightCard');
  if(mode==='ascii'){
    const a=asciiInfo(value);
    right.innerHTML=`<div class="output-label">ASCII INTERPRETATION</div><div class="char-output">${a.print?a.ch:'—'}</div><div class="explain">${a.label}</div>`;
  } else {
    right.innerHTML=`<div class="output-label">WHAT THE COMPUTER SEES</div><div class="explain-title">Eight switches, one value</div><div class="explain">Only the switches set to 1 contribute their assigned value.</div>`;
  }
  document.getElementById('note').style.display=mode==='ascii'?'block':'none';
  const ex=mode==='number'?[['0',0],['42',42],['255',255]]:[['A',65],['c',99],['t',116]];
  document.getElementById('exampleButtons').innerHTML=ex.map(([l,v])=>`<button class="example-btn" data-v="${v}">${l}</button>`).join(' ');
  document.querySelectorAll('.example-btn').forEach(b=>b.onclick=()=>setValue(Number(b.dataset.v)));
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
}
document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();});
document.getElementById('reset').onclick=()=>setValue(0);
render();
</script>
</body></html>
