<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artifact Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --paper:#FFFFFF; --folder:#E2E7ED; --ink:#1B2430; --muted:#5B6675;
  --line:#CDD3DB; --accent:#1F5C7A; --accent-ink:#FFFFFF; --flag:#9A5B12; --flag-bg:#FBEFD9;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151A21; --paper:#1D242D; --folder:#252E39; --ink:#E6EAF0; --muted:#98A3B2;
    --line:#35404D; --accent:#6DB3D6; --accent-ink:#0E1A22; --flag:#F0B866; --flag-bg:#3A2D17;
  }
}
:root[data-theme="dark"]{
  --bg:#151A21; --paper:#1D242D; --folder:#252E39; --ink:#E6EAF0; --muted:#98A3B2;
  --line:#35404D; --accent:#6DB3D6; --accent-ink:#0E1A22; --flag:#F0B866; --flag-bg:#3A2D17;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:40px 20px 80px}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--paper);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}

/* Home */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:36px;flex-wrap:wrap}
.top h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.top p{margin:6px 0 0;color:var(--muted)}

.folder{position:relative;margin-top:22px;background:var(--folder);border-radius:0 10px 10px 10px}
.folder::before{content:"";position:absolute;left:0;top:-11px;width:120px;height:12px;background:var(--folder);border-radius:8px 8px 0 0}
.folder summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;border-radius:0 10px 10px 10px}
.folder summary::-webkit-details-marker{display:none}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:2px}
.folder[open] .chev{transform:rotate(45deg)}
.folder-name{font-weight:600;font-size:18px;flex:1;min-width:0}
.count{color:var(--muted);font-size:14px;white-space:nowrap}
.folder-body{padding:0 10px 10px}
.list{background:var(--paper);border-radius:8px;border:1px solid var(--line);overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-link{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--accent);font-weight:500;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.item-link:hover{text-decoration-color:currentColor}
.tag{font-size:12px;font-weight:600;color:var(--flag);background:var(--flag-bg);padding:2px 8px;border-radius:99px}
.empty{padding:18px 16px;color:var(--muted);font-size:15px}
.add-row{display:flex;justify-content:flex-start;padding:10px 6px 4px}

/* Artifact page */
.crumb{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:14px;margin-bottom:10px}
.crumb:hover{color:var(--ink)}
.art-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.art-head h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.015em}
.art-head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;background:var(--folder);padding:3px;border-radius:9px}
.seg button{border:0;background:transparent;padding:6px 16px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,45,.12)}
.spacer{flex:1}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;height:min(70vh,640px)}
.stage iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.editor{width:100%;height:100%;border:0;resize:none;padding:16px;font:13.5px/1.6 var(--mono);background:var(--paper);tab-size:2;white-space:pre;overflow:auto}
.editor:focus-visible{outline:none}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--paper);color:var(--ink);width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(15,22,30,.45)}
.dlg{padding:22px}
.dlg h2{margin:0 0 16px;font-size:20px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg)}
.field textarea{font:13px/1.5 var(--mono);height:180px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

/* Fallback full-window view */
.solo{position:fixed;inset:0;z-index:50;background:#fff}
.solo iframe{width:100%;height:100%;border:0}
.solo-hint{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:rgba(20,28,38,.85);color:#fff;font-size:13px;padding:6px 10px;border-radius:6px;transition:opacity .4s}

@media (max-width:560px){.top h1{font-size:28px}.wrap{padding-top:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<dialog id="dlgFolder"><form method="dialog" class="dlg" id="formFolder">
  <h2>New assignment</h2>
  <label class="field"><span>Assignment name</span><input name="name" required autocomplete="off" placeholder="e.g. Bank Reconciliations"></label>
  <div class="dlg-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Create assignment</button></div>
</form></dialog>

<dialog id="dlgArtifact"><form method="dialog" class="dlg" id="formArtifact">
  <h2>Add artifact</h2>
  <label class="field"><span>Artifact name</span><input name="name" required autocomplete="off" placeholder="e.g. Interest calculator"></label>
  <label class="field"><span>HTML</span><textarea name="code" spellcheck="false"></textarea><div class="hint">Paste the artifact's full HTML. You can edit it later.</div></label>
  <div class="dlg-actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Add artifact</button></div>
</form></dialog>

<script>
const S = '<'+'/script>';
const base = 'body{font-family:system-ui,sans-serif;margin:0;padding:28px;color:#1b2430}button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid #bbb;background:#f6f7f9;cursor:pointer}input{font:inherit;padding:7px 9px;border:1px solid #bbb;border-radius:6px;width:140px}';

const samples = {
flash: `<!DOCTYPE html><html><head><title>Debit/credit flashcards</title><style>${base}
.card{width:320px;height:180px;border-radius:12px;background:#1f5c7a;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:20px;cursor:pointer;user-select:none}
.card.back{background:#e8eef3;color:#1b2430}</style></head><body>
<h2>Debit or credit?</h2><p>Click the card to flip it.</p>
<div class="card" id="c"></div><p><button id="n">Next card</button></p>
<script>
const d=[["Asset increases","Debit"],["Revenue increases","Credit"],["Expense increases","Debit"],["Liability decreases","Debit"],["Equity increases","Credit"]];
let i=0,f=false;const c=document.getElementById('c');
function r(){c.textContent=d[i][f?1:0];c.className='card'+(f?' back':'')}
c.onclick=()=>{f=!f;r()};document.getElementById('n').onclick=()=>{i=(i+1)%d.length;f=false;r()};r();
${S}</body></html>`,

taccount: `<!DOCTYPE html><html><head><title>T-account balancer</title><style>${base}
.t{display:grid;grid-template-columns:1fr 1fr;width:360px;border-top:2px solid #1b2430;margin-top:12px}
.t div{padding:10px}.t div:first-child{border-right:2px solid #1b2430}</style></head><body>
<h2>Cash</h2>
<div class="t"><div><b>Debit</b><br><input id="dr" type="number" value="5000"></div><div><b>Credit</b><br><input id="cr" type="number" value="3200"></div></div>
<p id="out"></p>
<script>
const dr=document.getElementById('dr'),cr=document.getElementById('cr'),o=document.getElementById('out');
function u(){const b=(+dr.value||0)-(+cr.value||0);o.textContent='Ending balance: $'+Math.abs(b).toLocaleString()+(b>=0?' debit':' credit')}
dr.oninput=cr.oninput=u;u();
${S}</body></html>`,

sl: `<!DOCTYPE html><html><head><title>Straight-line calculator</title><style>${base}
label{display:block;margin:10px 0}table{border-collapse:collapse;margin-top:16px}td,th{border:1px solid #ccd;padding:6px 12px;text-align:right}</style></head><body>
<h2>Straight-line depreciation</h2>
<label>Cost <input id="c" type="number" value="50000"></label>
<label>Salvage value <input id="s" type="number" value="5000"></label>
<label>Useful life (years) <input id="l" type="number" value="5"></label>
<table id="t"></table>
<script>
const $=id=>document.getElementById(id);
function u(){const c=+$('c').value,s=+$('s').value,l=Math.max(1,+$('l').value|0),a=(c-s)/l;let bv=c,h='<tr><th>Year</th><th>Expense</th><th>Book value</th></tr>';
for(let y=1;y<=l;y++){bv-=a;h+='<tr><td>'+y+'</td><td>'+a.toFixed(0)+'</td><td>'+bv.toFixed(0)+'</td></tr>'}$('t').innerHTML=h}
['c','s','l'].forEach(i=>$(i).oninput=u);u();
${S}</body></html>`,

compare: `<!DOCTYPE html><html><head><title>Method comparison</title><style>${base}
table{border-collapse:collapse}td,th{border:1px solid #ccd;padding:8px 12px;text-align:left}th{background:#e8eef3}</style></head><body>
<h2>Depreciation methods</h2>
<table><tr><th>Method</th><th>Expense pattern</th><th>Best fit</th></tr>
<tr><td>Straight-line</td><td>Equal each year</td><td>Assets used evenly</td></tr>
<tr><td>Double-declining</td><td>Higher early, lower later</td><td>Tech and vehicles</td></tr>
<tr><td>Units of production</td><td>Varies with usage</td><td>Machinery</td></tr></table>
</body></html>`,

sort: `<!DOCTYPE html><html><head><title>Cash flow sorter</title><style>${base}
.q{font-size:20px;margin:18px 0}.r{margin-top:14px;font-weight:600}</style></head><body>
<h2>Which section?</h2><div class="q" id="q"></div>
<button data-a="Operating">Operating</button> <button data-a="Investing">Investing</button> <button data-a="Financing">Financing</button>
<div class="r" id="r"></div>
<script>
const items=[["Paid suppliers for inventory","Operating"],["Bought equipment","Investing"],["Issued common stock","Financing"],["Collected from customers","Operating"],["Repaid a bank loan","Financing"]];
let i=0;const q=document.getElementById('q'),r=document.getElementById('r');
function show(){q.textContent=items[i][0]}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const ok=b.dataset.a===items[i][1];r.textContent=ok?'Correct.':'Not quite. It is '+items[i][1]+'.';i=(i+1)%items.length;setTimeout(()=>{r.textContent='';show()},1200)});show();
${S}</body></html>`
};

const STARTER = `<!DOCTYPE html>
<html>
<head>
  <title>New artifact</title>
  <style>body{font-family:system-ui,sans-serif;padding:28px}</style>
</head>
<body>
  <h2>New artifact</h2>
  <p>Replace this with your artifact's HTML.</p>
</body>
</html>`;

let uid = 0; const id = () => 'x' + (++uid);
const art = (name, code) => ({ id: id(), name, code, original: code });

const state = {
  view: { page: 'home' },
  mode: 'preview',
  assignments: [
    { id: id(), name: 'Intro to Journal Entries', open: true,  artifacts: [art('Debit/credit flashcards', samples.flash), art('T-account balancer', samples.taccount)] },
    { id: id(), name: 'Depreciation Methods',     open: false, artifacts: [art('Straight-line calculator', samples.sl), art('Method comparison table', samples.compare)] },
    { id: id(), name: 'Statement of Cash Flows',  open: false, artifacts: [art('Operating, investing, or financing?', samples.sort)] },
    { id: id(), name: 'Revenue Recognition',      open: false, artifacts: [] }
  ]
};

const app = document.getElementById('app');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function find(aid){ for (const f of state.assignments){ const a = f.artifacts.find(x => x.id === aid); if (a) return { f, a }; } }

function render(){
  state.view.page === 'home' ? renderHome() : renderArtifact();
}

function renderHome(){
  document.title = 'Artifact Library';
  app.innerHTML = `
    <div class="top">
      <div><h1>Artifact Library</h1><p>Every artifact the team has built, grouped by assignment.</p></div>
      <button class="btn primary" id="newFolder">New assignment</button>
    </div>
    ${state.assignments.map(f => `
      <details class="folder" data-f="${f.id}" ${f.open ? 'open' : ''}>
        <summary><span class="chev"></span><span class="folder-name">${esc(f.name)}</span>
          <span class="count">${f.artifacts.length} ${f.artifacts.length === 1 ? 'artifact' : 'artifacts'}</span></summary>
        <div class="folder-body">
          <div class="list">
            ${f.artifacts.length ? f.artifacts.map(a => `
              <div class="item">
                <button class="item-link" data-open="${a.id}" title="Open in a new tab">${esc(a.name)}</button>
                ${a.code !== a.original ? '<span class="tag">Edited</span>' : ''}
                <button class="btn ghost" data-edit="${a.id}">View code</button>
              </div>`).join('') : `<div class="empty">No artifacts yet. Add the first one for this assignment.</div>`}
          </div>
          <div class="add-row"><button class="btn" data-add="${f.id}">Add artifact</button></div>
        </div>
      </details>`).join('')}
  `;
  app.querySelectorAll('details.folder').forEach(d => d.addEventListener('toggle', () => {
    state.assignments.find(f => f.id === d.dataset.f).open = d.open;
  }));
  document.getElementById('newFolder').onclick = () => openDialog('dlgFolder');
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openStandalone(find(b.dataset.open).a));
  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { state.view = { page: 'artifact', id: b.dataset.edit }; state.mode = 'preview'; render(); window.scrollTo(0,0); });
  app.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { pendingFolder = b.dataset.add; openDialog('dlgArtifact', { code: STARTER }); });
}

function renderArtifact(){
  const { f, a } = find(state.view.id);
  document.title = a.name;
  const edited = a.code !== a.original;
  app.innerHTML = `
    <button class="crumb" id="back">‹ ${esc(f.name)}</button>
    <div class="art-head">
      <div><h1>${esc(a.name)}</h1><div class="sub">${edited ? 'Unsaved edits in this session' : 'No edits'}</div></div>
      <button class="btn" id="solo">Open in new tab</button>
    </div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="View">
        <button aria-pressed="${state.mode === 'preview'}" data-mode="preview">Preview</button>
        <button aria-pressed="${state.mode === 'code'}" data-mode="code">Code</button>
      </div>
      <span class="spacer"></span>
      ${edited ? '<button class="btn ghost" id="revert">Revert changes</button>' : ''}
    </div>
    <div class="stage" id="stage"></div>
  `;
  const stage = document.getElementById('stage');
  if (state.mode === 'preview'){
    const fr = document.createElement('iframe');
    fr.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals');
    fr.title = a.name; fr.srcdoc = a.code; stage.appendChild(fr);
  } else {
    const ta = document.createElement('textarea');
    ta.className = 'editor'; ta.spellcheck = false; ta.value = a.code; ta.setAttribute('aria-label', 'Artifact HTML');
    ta.addEventListener('input', () => {
      const was = a.code !== a.original; a.code = ta.value;
      if (was !== (a.code !== a.original)) { const pos = ta.selectionStart; render(); const t = app.querySelector('.editor'); t.focus(); t.setSelectionRange(pos, pos); }
    });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab' && !e.shiftKey){ e.preventDefault(); ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
    });
    stage.appendChild(ta);
  }
  document.getElementById('back').onclick = () => { state.view = { page: 'home' }; render(); };
  document.getElementById('solo').onclick = () => openStandalone(a);
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; render(); });
  const rv = document.getElementById('revert');
  if (rv) rv.onclick = () => { a.code = a.original; render(); };
}

/* Opens the artifact alone in a new tab; falls back to a full-window view if the browser blocks the tab. */
function openStandalone(a){
  let w = null;
  try { w = window.open('', '_blank'); } catch (e) {}
  if (w){
    try { w.document.open(); w.document.write(a.code); w.document.close(); return; }
    catch (e) { try { w.close(); } catch (_) {} }
  }
  const solo = document.createElement('div');
  solo.className = 'solo';
  solo.innerHTML = '<iframe sandbox="allow-scripts allow-forms allow-modals"></iframe><div class="solo-hint">Press Esc to close</div>';
  solo.querySelector('iframe').srcdoc = a.code;
  document.body.appendChild(solo);
  const hint = solo.querySelector('.solo-hint');
  setTimeout(() => hint.style.opacity = '0', 2200);
  const close = e => { if (e.key === 'Escape'){ solo.remove(); document.removeEventListener('keydown', close); } };
  document.addEventListener('keydown', close);
}

/* Dialogs */
let pendingFolder = null;
function openDialog(idName, values = {}){
  const d = document.getElementById(idName);
  d.querySelector('form').reset();
  for (const [k, v] of Object.entries(values)) d.querySelector(`[name="${k}"]`).value = v;
  d.showModal();
}
document.getElementById('dlgFolder').addEventListener('close', e => {
  const d = e.target; if (d.returnValue !== 'ok') return;
  const name = d.querySelector('[name=name]').value.trim(); if (!name) return;
  state.assignments.push({ id: id(), name, open: true, artifacts: [] });
  render();
});
document.getElementById('dlgArtifact').addEventListener('close', e => {
  const d = e.target; if (d.returnValue !== 'ok') return;
  const name = d.querySelector('[name=name]').value.trim(); if (!name) return;
  const code = d.querySelector('[name=code]').value || STARTER;
  const f = state.assignments.find(x => x.id === pendingFolder);
  f.artifacts.push(art(name, code)); f.open = true;
  render();
});

render();
</script>
</body>
</html>
